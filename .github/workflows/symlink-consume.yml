name: Symlink Artifact Consumer

on:
  workflow_run:
    workflows: ["Symlink Artifact Builder"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  consume:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download exact upstream artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: doc-build-artifact
          path: build_dir
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Inspect symlink using fake privileged canary
        env:
          HF_TOKEN: hf_FAKE_PRIVILEGED_WORKFLOW_TOKEN_DO_NOT_USE
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          p = Path("build_dir/huggingface_hub/environment.txt")
          print(f"EXISTS={p.exists()}")
          print(f"IS_SYMLINK={p.is_symlink()}")
          if p.is_symlink():
              print(f"LINK_TARGET={os.readlink(p)}")
          try:
              data = p.read_bytes()
              marker = os.environ["HF_TOKEN"].encode()
              print(f"READ_SUCCEEDED=True")
              print(f"FAKE_CANARY_PRESENT={marker in data}")
              print(f"READ_BYTES={len(data)}")
          except Exception as exc:
              print(f"READ_SUCCEEDED=False")
              print(f"READ_ERROR={type(exc).__name__}: {exc}")
          PY
