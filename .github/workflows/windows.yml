name: Windows path alias validation
on:
  workflow_dispatch:
  push:
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test harmless Win32 trailing-space alias
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import subprocess

          root = Path("worktree")
          subprocess.run(["git", "init", str(root)], check=True)
          canonical = root / ".git" / "hooks" / "post-checkout"
          alias = root / ".git " / "hooks" / "post-checkout"

          print("canonical_before=", canonical.exists())
          print("alias_parent=", alias.parent)
          alias.parent.mkdir(parents=True, exist_ok=True)
          alias.write_text("HARMLESS_WINDOWS_ALIAS_CANARY", encoding="utf-8")
          print("alias_exists=", alias.exists())
          print("canonical_after=", canonical.exists())
          print("canonical_content=", canonical.read_text(encoding="utf-8") if canonical.exists() else "MISSING")

          if not canonical.exists() or canonical.read_text(encoding="utf-8") != "HARMLESS_WINDOWS_ALIAS_CANARY":
              raise SystemExit("NOT CONFIRMED")
          print("CONFIRMED: .git<space> aliases .git on Windows")
          '@ | Set-Content -Path test_alias.py
          python test_alias.py
